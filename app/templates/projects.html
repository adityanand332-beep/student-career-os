{% extends 'base.html' %}{% block content %}<div class=sectionhead><h1>Projects</h1></div><form method=post class='card formgrid'><input name=title placeholder='Project title' required><input name=tech placeholder='Tech stack' required><select name=status><option>Planned</option><option>In Progress</option><option>Completed</option></select><input name=url placeholder='Demo/GitHub URL'><button>Add project</button></form><div class=stack>{% for p in projects %}<div class='card row'><div><h3>{{p.title}}</h3><p>{{p.tech}} · {{p.status}}</p>{% if p.url %}<a href='{{p.url}}' target=_blank>Open link</a>{% endif %}</div><form method=post action='/projects/delete/{{p.id}}'><button class=danger>Delete</button></form></div>{% else %}<div class=card>No projects yet.</div>{% endfor %}</div>{% endblock %}

{% extends 'base.html' %}{% block content %}<div class=sectionhead><h1>Certificates</h1></div><form method=post class='card formgrid'><input name=title placeholder='Certificate title' required><input name=issuer placeholder='Issuer' required><input name=issue_date type=date required><input name=url placeholder='Credential URL'><button>Add certificate</button></form><div class=stack>{% for c in certificates %}<div class='card row'><div><h3>{{c.title}}</h3><p>{{c.issuer}} · {{c.issue_date}}</p>{% if c.url %}<a href='{{c.url}}' target=_blank>Verify credential</a>{% endif %}</div></div>{% else %}<div class=card>No certificates yet.</div>{% endfor %}</div>{% endblock %}
